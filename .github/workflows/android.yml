name: Build Realistic Battle Royale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz \
            -O /tmp/godot-templates.tpz

          mkdir -p /tmp/godot-templates

          unzip -q \
            /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          cp /tmp/godot-templates/templates/android_debug.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"

          cp /tmp/godot-templates/templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          test -f project.godot
          test -f export_presets.cfg

      - name: Check export presets
        run: |
          echo "===== export_presets.cfg ====="
          cat export_presets.cfg

      - name: Build APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-release "Android" \
            build/RealisticBattleRoyale.apk

      - name: Verify APK
        run: |
          test -f build/RealisticBattleRoyale.apk
          ls -lh build/RealisticBattleRoyale.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-APK
          path: build/RealisticBattleRoyale.apk