name: Build Battle Royale Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Install Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"

          cp /tmp/godot_templates/templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

      - name: Check Godot project
        run: |
          godot --headless --path . --editor --quit

      - name: Show Android export presets
        run: |
          echo "===== export_presets.cfg ====="
          cat export_presets.cfg

      - name: Build Android APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --editor \
            --quit \
            --export-release "Android" \
            build/RealisticBattleRoyale.apk

      - name: Check APK
        run: |
          ls -lah build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-APK
          path: build/RealisticBattleRoyale.apk