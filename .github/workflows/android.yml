name: Build Realistic Battle Royale Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"

          yes | sdkmanager --licenses || true


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false


      - name: Configure environment
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          godot --version
          java -version


      - name: Install Godot export templates
        shell: bash
        run: |
          set -e

          VERSION="4.5.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$VERSION"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot_templates

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -O /tmp/godot_templates.tpz

          unzip -q \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          cp \
            /tmp/godot_templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp \
            /tmp/godot_templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

          echo "Installed templates:"
          ls -lh "$TEMPLATE_DIR"


      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

          echo "Godot Android settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"


      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f project.godot
          test -f export_presets.cfg

          echo "project.godot: OK"
          echo "export_presets.cfg: OK"

          echo ""
          echo "===== Android preset ====="
          cat export_presets.cfg


      - name: Validate Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_SDK_ROOT"
          test -f "$ANDROID_SDK_ROOT/platform-tools/adb"

          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK validation successful."


      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --editor \
            --path . \
            --quit


      - name: Verify export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

          echo "Android export templates are installed."


      - name: Build Android debug APK
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          echo "=========================================="
          echo "BUILDING REALISTIC BATTLE ROYALE"
          echo "=========================================="

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/RealisticBattleRoyale.apk


      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/RealisticBattleRoyale.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "=========================================="
          echo "APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK"
          file "$APK"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Android-APK
          path: build/RealisticBattleRoyale.apk
          if-no-files-found: error
          retention-days: 30