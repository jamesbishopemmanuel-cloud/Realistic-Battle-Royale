name: Build Realistic Battle Royale Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android APK Build
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses || true


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # GODOT
      # ==========================================

      - name: Setup Godot 4.5.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false


      # ==========================================
      # ENVIRONMENT
      # ==========================================

      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          echo "$ANDROID_SDK_ROOT"

          echo "======================================"
          echo "JAVA"
          echo "======================================"

          echo "$JAVA_HOME"

          java -version


      # ==========================================
      # GODOT EXPORT TEMPLATES
      # ==========================================

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -e

          GODOT_VERSION="4.5.1.stable"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot-templates

          echo "Downloading Godot export templates..."

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -O /tmp/godot-templates.tpz

          echo "Extracting templates..."

          unzip -q \
            /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          echo "Installing Android templates..."

          cp \
            /tmp/godot-templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp \
            /tmp/godot-templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

          echo "Installed templates:"

          ls -lh "$TEMPLATE_DIR"


      # ==========================================
      # VERIFY GODOT
      # ==========================================

      - name: Verify Godot
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GODOT VERSION"
          echo "======================================"

          godot --version


      # ==========================================
      # VERIFY ANDROID
      # ==========================================

      - name: Verify Android tools
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          test -d "$ANDROID_SDK_ROOT"

          echo "SDK exists."

          echo "======================================"
          echo "ADB"
          echo "======================================"

          "$ANDROID_SDK_ROOT/platform-tools/adb" version || true


      # ==========================================
      # VERIFY PROJECT
      # ==========================================

      - name: Verify Godot project
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn

          echo ""
          echo "Required project files found."


      # ==========================================
      # SHOW EXPORT PRESET
      # ==========================================

      - name: Check Android export preset
        shell: bash
        run: |
          echo "======================================"
          echo "export_presets.cfg"
          echo "======================================"

          cat export_presets.cfg


      # ==========================================
      # IMPORT GODOT PROJECT
      # ==========================================

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --editor \
            --path . \
            --quit


      # ==========================================
      # BUILD DIRECTORY
      # ==========================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build


      # ==========================================
      # BUILD ANDROID DEBUG APK
      # ==========================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ANDROID APK"
          echo "======================================"

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            build/RealisticBattleRoyale.apk


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          if [ ! -f "build/RealisticBattleRoyale.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh build/RealisticBattleRoyale.apk

          file build/RealisticBattleRoyale.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Android-APK
          path: build/RealisticBattleRoyale.apk
          if-no-files-found: error
          retention-days: 30