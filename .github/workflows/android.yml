name: Realistic Battle Royale - Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5.1"
  GODOT_VERSION_FULL: "4.5.1.stable"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  APK_NAME: "RealisticBattleRoyale.apk"

jobs:

  build-android:

    name: Build Android APK

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # JAVA 17
      # ======================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ======================================================
      # ANDROID SDK
      # ======================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK..."

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-${ANDROID_API}"
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"

          yes | sdkmanager --licenses || true

          echo "Android SDK ready."


      # ======================================================
      # GODOT
      # ======================================================

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false


      # ======================================================
      # GODOT EXPORT TEMPLATE CACHE
      # ======================================================

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION_FULL }}-android
          restore-keys: |
            godot-export-${{ env.GODOT_VERSION_FULL }}-
            godot-export-


      # ======================================================
      # INSTALL GODOT ANDROID EXPORT TEMPLATES
      # ======================================================

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -e

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION_FULL}"

          mkdir -p "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ] || \
             [ ! -f "$TEMPLATE_DIR/android_release.apk" ]; then

            echo "Downloading Godot Android export templates..."

            wget -q \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
              -O /tmp/godot-templates.tpz

            rm -rf /tmp/godot-templates

            mkdir -p /tmp/godot-templates

            unzip -q \
              /tmp/godot-templates.tpz \
              -d /tmp/godot-templates

            cp \
              /tmp/godot-templates/templates/android_debug.apk \
              "$TEMPLATE_DIR/android_debug.apk"

            cp \
              /tmp/godot-templates/templates/android_release.apk \
              "$TEMPLATE_DIR/android_release.apk"

          fi

          echo ""
          echo "Godot Android templates:"

          ls -lh "$TEMPLATE_DIR"


      # ======================================================
      # ENVIRONMENT CHECK
      # ======================================================

      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "GODOT"
          echo "========================================"

          godot --version

          echo ""
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "ADB"
          echo "========================================"

          adb version


      # ======================================================
      # VERIFY PROJECT
      # ======================================================

      - name: Verify Godot project
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          test -f project.godot
          test -f export_presets.cfg

          echo "project.godot: OK"
          echo "export_presets.cfg: OK"


      # ======================================================
      # CHECK ANDROID PRESET
      # ======================================================

      - name: Inspect Android export preset
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID EXPORT PRESET"
          echo "========================================"

          cat export_presets.cfg

          echo ""

          grep -q 'name="Android"' export_presets.cfg

          grep -q 'platform="Android"' export_presets.cfg

          echo ""
          echo "Android preset detected."


      # ======================================================
      # GODOT IMPORT
      # ======================================================

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          godot \
            --headless \
            --editor \
            --path . \
            --quit


      # ======================================================
      # PREPARE BUILD
      # ======================================================

      - name: Prepare build directory
        shell: bash
        run: |
          set -e

          rm -rf build

          mkdir -p build


      # ======================================================
      # BUILD APK
      # ======================================================

      - name: Build Android APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING REALISTIC BATTLE ROYALE"
          echo "========================================"

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            "build/${APK_NAME}"

          echo ""
          echo "APK BUILD COMMAND FINISHED."


      # ======================================================
      # VERIFY APK
      # ======================================================

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          test -f "build/${APK_NAME}"

          echo ""
          echo "APK FOUND:"
          ls -lh "build/${APK_NAME}"

          echo ""
          echo "APK TYPE:"
          file "build/${APK_NAME}"

          echo ""
          echo "APK SHA256:"
          sha256sum "build/${APK_NAME}"


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Android-APK
          path: build/RealisticBattleRoyale.apk
          if-no-files-found: error
          retention-days: 30


      # ======================================================
      # FAILURE DIAGNOSTICS
      # ======================================================

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD FAILED - DIAGNOSTICS"
          echo "========================================"

          echo ""
          echo "Godot:"
          godot --version || true

          echo ""
          echo "Project:"
          ls -la || true

          echo ""
          echo "Build directory:"
          ls -la build || true

          echo ""
          echo "Export templates:"
          ls -lh \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION_FULL}/" \
            || true

          echo ""
          echo "Android SDK:"
          sdkmanager --list_installed || true

          echo ""
          echo "Export preset:"
          cat export_presets.cfg || true


      # ======================================================
      # UPLOAD DIAGNOSTICS
      # ======================================================

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Build-Diagnostics
          path: |
            export_presets.cfg
            project.godot
            build/
          if-no-files-found: ignore
          retention-days: 7