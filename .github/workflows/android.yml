      - name: Diagnose Android export
        shell: bash
        run: |
          echo "======================================"
          echo "GODOT VERSION"
          echo "======================================"
          godot --version

          echo ""
          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "======================================"
          echo "JAVA"
          echo "======================================"
          echo "$JAVA_HOME"

          echo ""
          echo "======================================"
          echo "EXPORT PRESET"
          echo "======================================"
          cat export_presets.cfg

          echo ""
          echo "======================================"
          echo "EXPORT TEMPLATES"
          echo "======================================"

          ls -lh \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

          echo ""
          echo "======================================"
          echo "ANDROID SDK PACKAGES"
          echo "======================================"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-35|build-tools;35"

          echo ""
          echo "======================================"
          echo "GODOT PROJECT CHECK"
          echo "======================================"

          test -f project.godot
          test -f export_presets.cfg

          echo "Project files OK."