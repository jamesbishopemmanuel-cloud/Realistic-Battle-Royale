name: Build Realistic Battle Royale Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Download repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Install Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses || true


      # --------------------------------------------------
      # 3. Setup Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 4. Setup Godot 4.5.1
      # --------------------------------------------------
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false


      # --------------------------------------------------
      # 5. Configure Android environment
      # --------------------------------------------------
      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "===== Android SDK ====="
          echo "$ANDROID_SDK_ROOT"

          echo "===== Java ====="
          echo "$JAVA_HOME"

          java -version


      # --------------------------------------------------
      # 6. Install Godot Android export templates
      # --------------------------------------------------
      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -e

          GODOT_VERSION="4.5.1.stable"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot-templates

          echo "Downloading Godot export templates..."

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -O /tmp/godot-templates.tpz

          echo "Extracting templates..."

          unzip -q \
            /tmp/godot-templates.tpz \
            -d /tmp/godot-templates

          echo "Installing Android templates..."

          cp \
            /tmp/godot-templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp \
            /tmp/godot-templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

          echo "===== Installed templates ====="

          ls -lh "$TEMPLATE_DIR"


      # --------------------------------------------------
      # 7. Verify project files
      # --------------------------------------------------
      - name: Verify Godot project
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn

          echo "Project files found."


      # --------------------------------------------------
      # 8. Display project configuration
      # --------------------------------------------------
      - name: Display project configuration
        run: |
          echo "=========================================="
          echo "PROJECT.GODOT"
          echo "=========================================="

          cat project.godot

          echo ""
          echo "=========================================="
          echo "EXPORT_PRESETS.CFG"
          echo "=========================================="

          cat export_presets.cfg


      # --------------------------------------------------
      # 9. Verify Godot
      # --------------------------------------------------
      - name: Verify Godot installation
        run: |
          echo "=========================================="
          echo "GODOT VERSION"
          echo "=========================================="

          godot --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="
          echo "ADB"
          echo "=========================================="

          "$ANDROID_SDK_ROOT/platform-tools/adb" version || true


      # --------------------------------------------------
      # 10. Import project
      # --------------------------------------------------
      - name: Import Godot project
        run: |
          godot \
            --headless \
            --editor \
            --path . \
            --quit


      # --------------------------------------------------
      # 11. Create build directory
      # --------------------------------------------------
      - name: Prepare build directory
        run: |
          rm -rf build
          mkdir -p build


      # --------------------------------------------------
      # 12. Build Android DEBUG APK
      # --------------------------------------------------
      - name: Build Android APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ANDROID APK"
          echo "=========================================="

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            build/RealisticBattleRoyale.apk


      # --------------------------------------------------
      # 13. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING APK"
          echo "=========================================="

          test -f build/RealisticBattleRoyale.apk

          echo ""
          echo "APK CREATED SUCCESSFULLY!"
          echo ""

          ls -lh build/RealisticBattleRoyale.apk

          file build/RealisticBattleRoyale.apk


      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Android-APK
          path: build/RealisticBattleRoyale.apk
          if-no-files-found: error
          retention-days: 30