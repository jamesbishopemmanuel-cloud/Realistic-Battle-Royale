      - name: Diagnose Android export
        run: |
          echo "===== Godot version ====="
          godot --version

          echo "===== Android SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_SDK_ROOT"

          echo "===== Java ====="
          java -version

          echo "===== Export templates ====="
          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable/"

          echo "===== Project ====="
          test -f project.godot
          test -f export_presets.cfg

          echo "===== Preset ====="
          cat export_presets.cfg

      - name: Build APK with verbose diagnostics
        run: |
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --path . \
            --export-release "Android" \
            build/RealisticBattleRoyale.apk