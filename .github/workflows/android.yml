name: Build Realistic Battle Royale APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Configure Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        run: |
          VERSION="4.5.1.stable"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$VERSION"

          mkdir -p "$TEMPLATE_DIR"
          mkdir -p /tmp/godot-templates

          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          unzip -q /tmp/templates.tpz \
            -d /tmp/godot-templates

          cp /tmp/godot-templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp /tmp/godot-templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

      - name: Verify project
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/Main.tscn

      - name: Import Godot project
        run: |
          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Check environment
        run: |
          echo "Godot:"
          godot --version

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "Java:"
          java -version

          echo "Templates:"
          ls -lh \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Build Android APK
        run: |
          rm -rf build
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --path . \
            --export-release "Android" \
            build/RealisticBattleRoyale.apk

      - name: Verify APK
        run: |
          test -f build/RealisticBattleRoyale.apk

          echo "APK successfully created:"
          ls -lh build/RealisticBattleRoyale.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Android-APK
          path: build/RealisticBattleRoyale.apk
          if-no-files-found: error
          retention-days: 30