name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-release "Android" \
            build/RealisticBattleRoyale.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realistic-Battle-Royale-Android
          path: build/RealisticBattleRoyale.apk