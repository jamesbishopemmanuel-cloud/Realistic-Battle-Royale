[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/RealisticBattleRoyale.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2


[preset.0.options]

custom_template/debug=""
custom_template/release=""

# ============================================================
# GRADLE
# ============================================================

gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""

# ============================================================
# ANDROID ARCHITECTURES
# ARM64 ONLY - MODERN ANDROID PHONES
# ============================================================

architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

# ============================================================
# VERSION
# ============================================================

version/code=1
version/name="1.0.0"

# ============================================================
# APPLICATION
# ============================================================

package/unique_name="com.bishopemmanuel.realisticbattleroyale"
package/name="Realistic Battle Royale"

package/signed=false

package/app_category=0

package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=true

# ============================================================
# ICONS
# ============================================================

launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
launcher_icons/adaptive_monochrome_432x432=""

# ============================================================
# GRAPHICS
# ============================================================

graphics/opengl_debug=false

# ============================================================
# XR
# Disabled for normal Android phones
# ============================================================

xr_features/xr_mode=0

# ============================================================
# DISPLAY
# ============================================================

screen/immersive_mode=true

screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

# ============================================================
# USER DATA
# ============================================================

user_data_backup/allow=false

# ============================================================
# COMMAND LINE
# ============================================================

command_line/extra_args=""

# ============================================================
# APK EXPANSION
# Disabled - use normal APK/PCK for now
# ============================================================

apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

# ============================================================
# NETWORK
# ============================================================

permissions/access_network_state=true
permissions/internet=true
permissions/access_wifi_state=true
permissions/change_wifi_state=false

# ============================================================
# VIBRATION
# ============================================================

permissions/vibrate=true

# ============================================================
# BLUETOOTH
# Disabled unless the game specifically needs it
# ============================================================

permissions/bluetooth=false
permissions/bluetooth_admin=false
permissions/bluetooth_connect=false
permissions/bluetooth_scan=false

# ============================================================
# CAMERA
# Disabled by default
# ============================================================

permissions/camera=false

# ============================================================
# MICROPHONE
# Disabled by default
# Enable when voice chat is implemented
# ============================================================

permissions/record_audio=false

# ============================================================
# STORAGE
# Modern Android uses app-specific storage
# ============================================================

permissions/read_external_storage=false
permissions/write_external_storage=false

permissions/read_media_images=false
permissions/read_media_video=false
permissions/read_media_audio=false

permissions/access_media_location=false

# ============================================================
# LOCATION
# Disabled for the base game
# ============================================================

permissions/access_coarse_location=false
permissions/access_fine_location=false